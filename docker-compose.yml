version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: syncforge-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: syncforge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - syncforge-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncforge-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: syncforge-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongodb:27017/syncforge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: syncforge_super_secure_jwt_secret_key_minimum_32_chars
      JWT_EXPIRES_IN: 7d
      SNAPSHOT_UPDATE_THRESHOLD: 50
      SNAPSHOT_INTERVAL_MS: 60000
      PERSISTENCE_DEBOUNCE_MS: 2000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syncforge-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: syncforge-frontend
    restart: always
    networks:
      - syncforge-network

  nginx:
    image: nginx:alpine
    container_name: syncforge-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - syncforge-network

volumes:
  mongodb_data:
  redis_data:

networks:
  syncforge-network:
    driver: bridge
